name: Django CI

on:
  push:
    branches: [ "github" ]
  pull_request:
    branches: [ "github" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Linting (Black & Flake8)
      working-directory: ./backend
      run: |
        pip install black flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Code Quality Check
      working-directory: ./backend
      run: |
        python manage.py check --deploy

    - name: Verify Django Project Structure
      working-directory: ./backend
      run: |
        python manage.py showmigrations --plan 2>/dev/null || echo "Migration check skipped"

    - name: Python Syntax Validation
      working-directory: ./backend
      run: |
        python -m py_compile manage.py
        find application -name "*.py" -exec python -m py_compile {} \; 2>/dev/null || echo "Syntax check completed"
